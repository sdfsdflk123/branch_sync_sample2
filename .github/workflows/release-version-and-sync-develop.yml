name: Version and sync develop

on:
  pull_request:
    types:
      - closed
    branches:
      - master

jobs:
  version-and-push-master:
    if: >
      github.event.pull_request.merged == true &&
      (
        startsWith(github.event.pull_request.head.ref, 'hotfix/') ||
        startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      token: ${{ steps.app-token.outputs.token }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SYNC_DEVELOP_APP_ID }}
          private-key: ${{ secrets.SYNC_DEVELOP_APP_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: master
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "branch-sync-bot"
          git config user.email "branch-sync-bot@users.noreply.github.com"

      - name: Determine release type
        id: release
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          if [[ "$branch" == hotfix/* ]]; then
            echo "release_as=patch" >> "$GITHUB_OUTPUT"
          elif [[ "$branch" == release/* ]]; then
            echo "release_as=minor" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch prefix: $branch"
            exit 1
          fi

      - name: Version master with standard-version
        run: |
          npx --yes standard-version --release-as "${{ steps.release.outputs.release_as }}"

      - name: Push version commit and tag to master
        run: |
          git push origin master --follow-tags

  sync-develop:
    needs: version-and-push-master
    uses: ./.github/workflows/sync-base-to-develop.reusable.yml
    with:
      base_branch: master
      target_branch: develop
    secrets:
      token: ${{ needs.version-and-push-master.outputs.token }}
